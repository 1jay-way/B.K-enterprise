<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>B.K Enterprise | Admin Portal</title>

  <link rel="stylesheet" href="admin.css">

  <meta name="theme-color" content="#123D2B">
</head>

<body class="admin-body">

  <main class="login-shell">

    <section class="login-card">

      <div class="admin-mark">BK</div>

      <p class="eyebrow">B.K ENTERPRISE</p>

      <h1>Welcome Back.</h1>

      <p>
        Access your business workspace.
        Sign in to manage your products, prices,
        images and availability.
      </p>

      <form id="login-form">

        <div>
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            autocomplete="username"
            required
          >
        </div>

        <div>
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <p id="login-message" role="alert"></p>

        <button type="submit" class="primary-btn">
          Sign In to Dashboard
        </button>

      </form>

      <a href="../index.html" class="back-link">
        ← Return to B.K Enterprise
      </a>

    </section>

    <p style="
      text-align:center;
      color:#D4E5D8;
      font-size:11px;
      margin-top:22px;
      letter-spacing:1px;
    ">
      B.K ENTERPRISE · ADMINISTRATION
    </p>

  </main>

  <script type="module" src="admin.js"></script>

</body>
</html>
